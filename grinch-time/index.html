<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grinch · Fotos do time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="snow" aria-hidden="true"></div>

  <header class="hero">
    <p class="eyebrow">Natal do time</p>
    <h1>Grinch</h1>
    <p class="lede">Solta as fotos do time — cada uma vira a bola de Natal na mão do Grinch.</p>
  </header>

  <main>
    <section class="dropzone" id="dropzone" tabindex="0">
      <input type="file" id="fileInput" accept="image/*" multiple hidden />
      <div class="dropzone-inner">
        <span class="drop-icon" aria-hidden="true">↓</span>
        <p><strong>Arraste as fotos aqui</strong> ou <button type="button" class="linkish" id="pickBtn">escolha arquivos</button></p>
        <p class="hint">PNG ou JPG · várias de uma vez</p>
      </div>
    </section>

    <section class="toolbar" id="toolbar" hidden>
      <button type="button" class="btn primary" id="downloadAll" disabled>Baixar todas (ZIP)</button>
      <button type="button" class="btn ghost" id="clearAll">Limpar</button>
      <span class="count" id="count"></span>
    </section>

    <section class="gallery" id="gallery"></section>
  </main>

  <footer>
    <p>Arte base a partir da sua referência · uso interno do time</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
